<title>Global Payment Network Signal Colour</title>
<style>
/*FONTS*/
:root{--bg:#FFFFFF; --sunk:#FAF8F5; --sunk-2:#F4F1EB; --ink:#1C1A17; --ink-2:#54514D; --ink-3:#6B6760; --rule:#E0DCD3; --acc:#013D5B; --good:#62800B; --warn:#8A7515; --bad:#BF5547; --ui:'Proxima Nova',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,p{margin:0; font-weight:400}
.page{max-width:1180px; margin:0 auto; padding:48px 40px 80px}
.page > h1{font-size:30px; letter-spacing:-.02em}
.page > p{color:var(--ink-3); margin-top:8px; max-width:640px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:36px}
.cand{background:var(--sunk); border-radius:12px; padding:28px; --sig:#000}
.cand h2{font-size:20px; letter-spacing:-.015em; display:flex; align-items:center; gap:12px}
.cand h2 i{width:26px; height:26px; border-radius:6px; background:var(--sig); flex:none}
.cand .hex{font-size:13px; color:var(--ink-3); margin-top:4px}
.cand .why{font-size:14px; color:var(--ink-2); margin-top:14px; line-height:1.5; min-height:88px}
.demo{background:#fff; border-radius:8px; padding:22px; margin-top:20px}
.demo .k{font-size:13px; color:var(--ink-3)}
.demo .big{font-size:40px; letter-spacing:-.025em; line-height:1.05; margin-top:2px}
.demo .row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--rule); font-size:14.5px}
.demo .row:first-of-type{margin-top:16px}
.demo .row .st{margin-left:auto; font-size:13.5px}
.demo .row.hot{position:relative}
.demo .row.hot::before{content:""; position:absolute; left:-22px; top:14px; bottom:14px; width:3px; background:var(--sig); border-radius:2px}
.demo .btns{display:flex; gap:10px; margin-top:18px}
.btn{font-size:14px; padding:9px 14px; border-radius:4px; border:1px solid var(--ink); background:#fff; color:var(--ink)}
.btn.pri{background:var(--sig); border-color:var(--sig); color:var(--sig-on,#fff)}
.demo svg{display:block; width:100%; height:64px; margin-top:16px}
.ok{color:var(--good)} .wa{color:var(--warn)} .no{color:var(--bad)}
.sem{display:flex; gap:14px; margin-top:16px; font-size:13px}
.sem span{display:flex; align-items:center; gap:6px}
.sem i{width:10px; height:10px; border-radius:50%}
.navy{width:100%; margin-top:14px; background:var(--acc); color:#fff; border-radius:6px; padding:14px 16px; font-size:14px; display:flex; align-items:center; justify-content:space-between}
.navy b{font-weight:400; color:var(--sig)}
</style>
<div class="page">
  <h1>Discover orange, dosed</h1>
  <p>The last page broke its own rule and put orange on five things. Same hue, three dosages: charts stay navy, the navy block stays plain, and the status colours are untouched.</p>
  <div class="grid" id="g"></div>
</div>
<script>
var C=[
 {n:'Button and marker', hex:'#FF6000', btn:true, mark:true, why:'Orange on the one action and the one row that needs Dara. Chart in navy, navy block plain, nothing else. Two touches per screen.'},
 {n:'Marker only', hex:'#FF6000', btn:false, mark:true, why:'The primary button goes back to navy. Orange appears once, as the 3px mark on the row that needs her. The quietest possible use of a brand colour.'},
 {n:'Button only', hex:'#FF6000', btn:true, mark:false, why:'Orange is the action and nothing else. Attention rows are carried by their status word. Closest to how Ramp uses chartreuse.'}
];
var pts='M0 50 L23 56 L46 46 L69 35 L92 39 L115 28 L138 32 L162 21 L185 18 L208 25 L231 14 L254 8 L277 11 L300 4';
document.getElementById('g').innerHTML=C.map(function(c){
 var navy='#013D5B';
 return '<div class="cand" style="--sig:'+c.hex+'; --sig-on:#fff"><h2><i></i>'+c.n+'</h2><div class="hex">'+c.hex+' · Discover orange</div><p class="why">'+c.why+'</p>'
 +'<div class="demo"><div class="k">Monthly book value</div><div class="big">$168.4M</div>'
 +'<svg viewBox="0 0 300 60" preserveAspectRatio="none"><path d="'+pts+' L300 60 L0 60 Z" fill="'+navy+'" opacity=".06"/><path d="'+pts+'" fill="none" stroke="'+navy+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'
 +'<div class="row '+(c.mark?'hot':'')+'">Northgate Financial<span class="st wa">Watch</span></div><div class="row">Bayline Payments<span class="st no">At risk</span></div><div class="row">Cordell Retail Group<span class="st ok">Healthy</span></div>'
 +'<div class="btns"><button class="btn pri" style="'+(c.btn?'':'background:'+navy+'; border-color:'+navy)+'">Chase the document</button><button class="btn">Log a call</button></div>'
 +'<div class="sem"><span><i style="background:var(--good)"></i>Healthy</span><span><i style="background:var(--warn)"></i>Watch</span><span><i style="background:var(--bad)"></i>At risk</span></div>'
 +'<div class="navy">Needs you today <b style="color:#fff">1 partner</b></div></div></div>';
}).join('');
</script>
